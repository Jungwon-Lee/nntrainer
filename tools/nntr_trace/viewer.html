<style>

:root {

  --accent: #1a73e8; --ovl: rgba(26,115,232,.12);
  --cpu: #7fb3e0; --hmx: #f0a080; --hvx: #8fd4b0; --rpc: #f2d472; --dma: #b0a8e0; --sync: #cfcfcf; --frame: #9a9a9a; --wait: #f2d472; --load: #bdbdbd;
  --serious: #d9822b; --critical: #c5221f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1e1e; --chrome: #2b2b2b; --chrome-2: #333; --line: #444; --grid: #2a2a2a;
    --ink: #e6e6e6; --ink-2: #b5b5b5; --ink-3: #8a8a8a; --sel: #fff; --slice-ink: #111;
    --ruler: #262626; --proc: #33404d; --tip-bg: #3a3a30; --tip-ink: #f0f0e0; --tip-line: #666;

}

  --ruler: #262626; --proc: #33404d; --tip-bg: #3a3a30; --tip-ink: #f0f0e0; --tip-line: #666;

* { box-sizing: border-box; }

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CAT = {
  'host.cpu': 'cpu', 'host.rpc': 'rpc', 'host.wait': 'wait', 'host.layer': 'frame', 'host.phase': 'frame', 'host.load': 'load',
  'dsp.hmx': 'hmx', 'dsp.hvx': 'hvx', 'dsp.dma': 'dma', 'dsp.dma.bound': 'dma', 'dsp.sync': 'sync', 'dsp.call': 'frame', 'dsp.entry': 'frame', 'qnn.op': 'cpu',
};
const LANES = ['dsp.hmx', 'dsp.hvx', 'dsp.dma'];
const BUSY_CATS = [...LANES, 'host.cpu'];
// catapult's general-purpose slice palette (color_scheme.html paletteBase), as chrome://tracing draws them
const PALETTE = ['rgb(138,113,152)','rgb(175,112,133)','rgb(127,135,225)','rgb(93,163,141)','rgb(115,138,126)','rgb(153,119,131)','rgb(93,155,213)','rgb(116,164,166)','rgb(202,134,113)','rgb(144,139,149)','rgb(155,130,150)','rgb(105,160,167)','rgb(106,151,204)','rgb(133,147,153)','rgb(120,131,206)','rgb(88,152,203)','rgb(131,134,195)','rgb(112,158,150)','rgb(90,153,138)','rgb(93,149,194)'];
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
const FONT = '11px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
const ROW = 17, HDR = 22, LABEL_W = 170, PROC_H = 18, CTR_H = 30, HEAT_H = 14;
// sequential blue ramp for the units-busy strips (light: steps 100..600 of the reference palette)
const HEAT = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];

// ---------- state ----------
let T = null;                      // {models, rows, height, tmin (0), tmax, all, md, phases, flows}
let view = { t0: 0, t1: 1 };       // relative µs (every model is normalized to start at 0)
let selected = null, filter = '', range = null, colorBy = 'op', tab = 'sel';
const collapsed = new Set();
const cv = $('#cv'), ctx = cv.getContext('2d'), tl = $('#tl');

// ---------- model ----------
function parseEvents(doc, name) {

  const procs = new Map();
  const P = pid => procs.get(pid) || (procs.set(pid, { pid, name: 'pid ' + pid, sort: pid, threads: new Map() }), procs.get(pid));
  const TH = (pid, tid) => { const p = P(pid); return p.threads.get(tid) || (p.threads.set(tid, { pid, tid, name: 'tid ' + tid, sort: tid, ev: [], depth: 1 }), p.threads.get(tid)); };

      else if (e.name === 'process_sort_index') P(e.pid).sort = e.args.sort_index;
      else if (e.name === 'thread_name') TH(e.pid, e.tid).name = e.args.name;
      else if (e.name === 'thread_sort_index') TH(e.pid, e.tid).sort = e.args.sort_index;

  for (const c of counters.values()) { for (const p of c.pts) p[0] -= tmin; c.pts.sort((a, b) => a[0] - b[0]); }
  for (const p of procs.values()) for (const th of p.threads.values()) {
    for (const e of th.ev) e.ts -= tmin;
    th.ev.sort((a, b) => a.ts - b.ts || b.dur - a.dur);
    const st = []; let maxd = 0;
    th.ev.forEach((e, i) => {
      while (st.length && st[st.length - 1].ts + st[st.length - 1].dur <= e.ts + 1e-6) st.pop();
      e._d = st.length; maxd = Math.max(maxd, e._d); st.push(e);
      e._cat = CAT[e.cat] || 'sync'; e._th = th; e._i = i;
      e._op = (e.args && (e.args.op || e.args.operation)) || e.name;
      e._label = (e.args && e.args.display_label) || (e.args && e.args.op && !e.name.includes(e.args.op) ? e.args.op + ': ' + e.name : e.name);
    });

  }

  for (const p of plist) p.tlist = [...p.threads.values()].sort((a, b) => a.sort - b.sort);
  const all = plist.flatMap(p => p.tlist.flatMap(t => t.ev));
  const phases = all.filter(e => e.cat === 'host.phase').sort((a, b) => a.ts - b.ts);

  // engine lanes (DSP) or the CPU slices (host).
  const heat = [];
  for (const p of plist) {
    const pev = p.tlist.flatMap(t => t.ev);
    const lanes = pev.filter(e => LANES.includes(e.cat));
    if (lanes.length) heat.push({ pid: p.pid, name: 'units busy', kind: 'heat', ...busySeries(lanes) });

}
function busySeries(events) {

function counterAt(c, t) { // value of a counter at time t (step function), binary search
  const pts = c.pts; let lo = 0, hi = pts.length - 1, ans = -1;

const hiddenModels = new Set(); // W3: model indices hidden by the View select
function layoutRows(models) {

    if (hiddenModels.has(mi)) return;

      for (const c of m.counters) if (c.pid === p.pid && c.kind === 'heat') { rows.push({ kind: 'ctr', c, m, y, h: HEAT_H }); c._y = y; y += HEAT_H; }

    }
  });

}

function buildT(models) {
  const m = models[0], L = layoutRows(models);

function relayout() { const L = layoutRows(T.models); T.rows = L.rows; T.height = L.height; resize(); draw(); }

// ---------- interval math ----------
function union(iv) { iv = iv.filter(x => x[1] > x[0]).sort((a, b) => a[0] - b[0]); const o = []; for (const x of iv) { const l = o[o.length - 1]; if (l && x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else o.push([x[0], x[1]]); } return o; }

const EPS = 1e-6; // µs; slices are written with 3 decimals, so anything below this is float residue
function inter(a, b) { const o = []; let i = 0, j = 0; while (i < a.length && j < b.length) { const lo = Math.max(a[i][0], b[j][0]), hi = Math.min(a[i][1], b[j][1]); if (hi > lo + EPS) o.push([lo, hi]); if (a[i][1] < b[j][1]) i++; else j++; } return o; }

const inRange = (e, r) => e.ts < r.t1 && e.ts + e.dur > r.t0;

const fmt = us => us >= 1000 ? (us / 1000).toFixed(3) + ' ms' : us.toFixed(3) + ' µs';
const pct = x => (x * 100).toFixed(1) + '%';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ---------- metrics ----------
function metrics(r, all = T.all) {

    const c = th.ev.find(e => BUSY_CATS.includes(e.cat)); if (!c) continue;
    occ.push({ th, cat: c._cat, busy: len(spans(e => e._th === th && BUSY_CATS.includes(e.cat), r, all)) / wall });

function kernels(r, all = T.all, md = T.md) {
  const m = new Map(), mhz = md.dsp_clock_mhz || 1200;
  for (const e of all) {
    if (!e.args || !e.args.engine || !e.args.elems || !['dsp.hmx', 'dsp.hvx'].includes(e.cat) || !inRange(e, r)) continue;
    const k = e.args.engine + '|' + e._label, row = m.get(k) || (m.set(k, { engine: e.args.engine, name: e._label, cls: e.args.class || null, n: 0, us: 0, elems: 0, cyc: 0, ops: 0 }), m.get(k));
    row.n++; row.us += e.dur; row.elems += e.args.elems; row.cyc += e.args.cycles || 0; row.ops += opsOf(e) || 0;

  return [...m.values()].map(k => ({ ...k, cpe: (k.cyc || k.us * mhz) / k.elems, tops: k.ops ? k.ops / k.us / 1e6 : null })).sort((a, b) => b.us - a.us);

function layerRows(r, all = T.all) {
  return all.filter(e => e.cat === 'host.layer' && inRange(e, r)).map(e => ({ e, m: metrics({ t0: Math.max(e.ts, r.t0), t1: Math.min(e.ts + e.dur, r.t1) }, all) }));
